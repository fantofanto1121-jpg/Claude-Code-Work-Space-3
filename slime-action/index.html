<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>スライム・スリング アドベンチャー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage" class="stage">
  <canvas id="game" class="game-canvas"></canvas>

  <!-- ===== HUD（絵は素材シートのもの。数値だけ HTML 側で重ねる） ===== -->
  <div class="hud hidden" id="hud">
    <div class="status">
      <img class="panel" src="assets/sheet/ui/ui_status_panel.png" alt="">
      <div class="hearts" id="hearts"></div>
      <div class="spbar"><i id="spFill"></i></div>
    </div>

    <div class="hud-right">
      <div class="row">
        <div class="chip stage-chip"><b id="stageNo">ステージ 1-1</b><span id="stageName">はじまりの森</span></div>
        <button class="chip btn" id="btnPause" type="button">一時停止</button>
        <button class="chip btn" id="btnSound" type="button">音 ON</button>
      </div>
      <div class="row">
        <div class="chip quest">
          <img src="assets/sheet/ui/ui_pin.png" alt="">
          <span>モンスター</span><b id="killCount">0</b><span class="total" id="killTotal">/5</span>
        </div>
      </div>
      <div class="row">
        <div class="chip"><img src="assets/sheet/ui/ui_coin.png" alt=""><b id="coinCount">0</b></div>
        <div class="chip"><img src="assets/sheet/ui/ui_gem.png" alt=""><b id="crystalCount">0</b></div>
        <div class="chip key-chip" id="keyChip"><img src="assets/sheet/ui/ui_key.png" alt=""><b id="keyCount">0</b></div>
        <div class="chip"><img src="assets/sheet/ui/ui_chest.png" alt=""><b id="chestCount">0</b><span class="total" id="chestTotal">/1</span></div>
      </div>
      <div class="row">
        <div class="heightpanel">
          <img src="assets/sheet/ui/ui_height_panel.png" alt="">
          <span class="value"><b id="heightNow">0</b>m</span>
        </div>
        <div class="compass">
          <img src="assets/sheet/ui/ui_compass.png" alt="">
          <canvas id="minimap" width="150" height="150"></canvas>
        </div>
      </div>
    </div>

    <div class="pull" id="pullGauge">
      <span class="label">ひっぱりの強さ</span>
      <div class="track"><i id="pullFill"></i></div>
    </div>

    <div class="actions">
      <button class="imgbtn" id="btnSpecial" type="button" aria-label="スペシャル">
        <img src="assets/sheet/ui/ui_btn_special.png" alt="">
      </button>
      <button class="imgbtn main" id="btnLaunch" type="button" aria-label="はじく">
        <img src="assets/sheet/ui/ui_btn_slime.png" alt="">
      </button>
      <button class="imgbtn" id="btnHeal" type="button" aria-label="回復">
        <img src="assets/sheet/ui/ui_btn_potion.png" alt="">
        <em>結晶3で回復</em>
      </button>
    </div>

    <div class="intro" id="intro">
      <div class="banner"><img src="assets/sheet/ui/ui_quest_banner.png" alt=""></div>
      <img class="tutorial" src="assets/sheet/ui/ui_tutorial.png" alt="">
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <!-- ===== タイトル ===== -->
  <div class="screen" id="titleScreen">
    <img class="title-castle" src="assets/sheet/bg/castle_island.png" alt="">
    <h1>スライム・スリング アドベンチャー</h1>
    <p class="lead">スライムを引っ張って はなすと、反対がわへ 飛びます。<br>勢いよく ぶつかって、ステージの モンスターを すべて倒しましょう。</p>
    <button class="imgbtn start" id="btnStart" type="button">
      <img src="assets/sheet/ui/ui_btn_slime.png" alt="">
      <em>はじめる</em>
    </button>
    <img class="title-row" src="assets/sheet/ui/ui_slime_row.png" alt="">
    <p class="note">マウスでも タッチでも 遊べます</p>
  </div>

  <!-- ===== パネル ===== -->
  <div class="screen hidden" id="panelScreen">
    <div class="panel-box">
      <h2 id="panelTitle">一時停止</h2>
      <div class="stats" id="panelStats"></div>
      <img class="progress" id="stageProgress" src="assets/sheet/ui/ui_slime_row.png" alt="">
      <div class="panel-buttons">
        <button class="txtbtn" id="btnPrimary" type="button"><span>つづける</span></button>
        <button class="txtbtn" id="btnSecondary" type="button"><span>タイトルへ</span></button>
      </div>
    </div>
  </div>

  <div class="loading" id="loading"><span>素材を読み込んでいます</span><i id="loadBar"></i></div>
</div>

<script src="js/sheet_data.js"></script>
<script src="js/assets.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
