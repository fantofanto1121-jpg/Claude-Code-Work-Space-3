# Render (https://render.com) 用の設定ファイル。
# リポジトリをRenderに接続すると、この内容が自動で読み込まれます。
# 手順の詳細は docs/DEPLOY.md を参照してください。
services:
  - type: web
    # 注意: この名前がそのまま公開URL（https://<name>.onrender.com）になります。
    #       Render全体で世界に1つだけなので、他の人と重複する場合は変更が必要です。
    name: nextech-bbs
    runtime: python
    plan: free
    region: singapore          # 日本から最も近いリージョン
    # このリポジトリの既定ブランチ。別のブランチで運用する場合は書き換える。
    branch: claude/gifted-galileo-f3ce46
    buildCommand: "pip install -r requirements.txt"
    # テーブルと初期カテゴリーはアプリ起動時に自動で用意されるため、
    # preDeployCommand は不要です（Render 無料プランでは Shell が使えないため）。
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true     # Renderが安全なランダム値を自動生成する
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        sync: false             # Neon の接続URLを手入力（画面から設定）
      - key: BASE_URL
        sync: false             # サービス作成後に表示される実際のURLを入力する
      - key: SITE_NAME
        value: NEXTECH
      - key: ADMIN_EMAILS
        sync: false             # 自分のメールアドレス
      - key: RESEND_API_KEY
        sync: false             # 未設定でも動作する（メール送信のみ無効）
      - key: MAIL_FROM
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
