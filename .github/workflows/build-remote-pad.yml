name: Build Remote Pad (Windows exe)

on:
  push:
    branches: ["**"]
    paths:
      - "remote-pc-control/**"
      - ".github/workflows/build-remote-pad.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # --onedir avoids the single file bootloader that unpacks itself into a
      # temp folder at launch, which is what antivirus heuristics flag. --noupx
      # keeps the binaries uncompressed for the same reason.
      - name: Build RemotePad
        working-directory: remote-pc-control
        run: >
          pyinstaller --onedir --console --clean --noupx
          --name RemotePad
          --add-data "web;web"
          --paths agent
          agent/pc_agent.py

      - name: Smoke test the binary
        working-directory: remote-pc-control
        shell: pwsh
        run: |
          $agent = Start-Process -FilePath dist\RemotePad\RemotePad.exe `
               -ArgumentList '--host','127.0.0.1','--port','8791','--pin','424242' `
               -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 6
          try {
            $info = Invoke-RestMethod 'http://127.0.0.1:8791/api/info'
            Write-Host "info: $($info | ConvertTo-Json -Compress)"
            if ($info.backend -ne 'win32') { throw "expected the win32 backend, got $($info.backend)" }
            if ($info.bpp -lt 24) {
              throw "the capture bitmap is $($info.bpp) bit; a colour capture needs 24 or more"
            }
            Write-Host "capture depth: $($info.bpp) bit"

            $page = Invoke-WebRequest 'http://127.0.0.1:8791/' -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw "the UI was not served" }
            Write-Host "index.html: $($page.RawContentLength) bytes"

            $bad = $null
            try { Invoke-WebRequest 'http://127.0.0.1:8791/api/shot?pin=000000' -UseBasicParsing }
            catch { $bad = $_.Exception.Response.StatusCode.value__ }
            if ($bad -ne 403) { throw "a wrong PIN should be refused, got $bad" }

            Invoke-WebRequest 'http://127.0.0.1:8791/api/shot?pin=424242&w=640' `
              -UseBasicParsing -OutFile shot.png
            $sig = [System.IO.File]::ReadAllBytes("$PWD\shot.png")[0..3]
            if (($sig -join ',') -ne '137,80,78,71') { throw "the capture is not a PNG" }
            Write-Host "capture: $((Get-Item shot.png).Length) bytes of PNG"

            Add-Type -AssemblyName System.Drawing
            $bm = [System.Drawing.Bitmap]::FromFile("$PWD\shot.png")
            try {
              $seen = @{}
              for ($y = 0; $y -lt $bm.Height; $y += 7) {
                for ($x = 0; $x -lt $bm.Width; $x += 7) {
                  $px = $bm.GetPixel($x, $y)
                  $seen["$($px.R),$($px.G),$($px.B)"] = $true
                }
              }
              Write-Host "distinct colours sampled: $($seen.Count)"
              if ($seen.Count -le 2) {
                throw "the capture holds $($seen.Count) colour(s); it is monochrome"
              }
            } finally { $bm.Dispose() }
            # HTTP alone proves nothing: the live control runs over a websocket
            $ct = [Threading.CancellationToken]::None
            $ws = New-Object System.Net.WebSockets.ClientWebSocket
            if (-not $ws.ConnectAsync([Uri]"ws://127.0.0.1:8791/ws", $ct).Wait(8000)) {
              throw "the websocket handshake timed out"
            }
            if ($ws.State -ne [System.Net.WebSockets.WebSocketState]::Open) {
              throw "the websocket did not open (state $($ws.State))"
            }
            Write-Host "websocket: open"

            function Send-Json($sock, $token, $text) {
              $b = [Text.Encoding]::UTF8.GetBytes($text)
              $null = $sock.SendAsync([ArraySegment[byte]]::new($b),
                        [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $token).Wait(5000)
            }
            function Recv-Msg($sock, $token) {
              $buf = [byte[]]::new(131072)
              $t = $sock.ReceiveAsync([ArraySegment[byte]]::new($buf), $token)
              if (-not $t.Wait(10000)) { throw "the agent never answered" }
              $res = $t.Result
              if ($res.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Binary) {
                return @{ kind = 'bin'; len = $res.Count }
              }
              return @{ kind = 'text'; text = [Text.Encoding]::UTF8.GetString($buf, 0, $res.Count) }
            }

            Send-Json $ws $ct '{"t":"auth","pin":"424242"}'
            $m = Recv-Msg $ws $ct
            if ($m.text -notmatch '"t":"ready"') { throw "auth was refused: $($m.text)" }
            Write-Host "websocket auth: $($m.text)"

            Send-Json $ws $ct '{"t":"rel","dx":4,"dy":-3}'
            Send-Json $ws $ct '{"t":"btn","b":"left","s":"click"}'
            Send-Json $ws $ct '{"t":"text","s":"ok"}'
            Send-Json $ws $ct '{"t":"ping","id":7}'
            $m = Recv-Msg $ws $ct
            if ($m.text -notmatch '"t":"pong"') { throw "no pong came back: $($m.text)" }
            Write-Host "websocket ping: $($m.text)"

            Send-Json $ws $ct '{"t":"frame","w":640,"full":true}'
            $chunks = 0; $bytes = 0
            while ($true) {
              $m = Recv-Msg $ws $ct
              if ($m.kind -eq 'bin') { $chunks++; $bytes += $m.len; continue }
              if ($m.text -match '"t":"frame_end"') { Write-Host "frame_end: $($m.text)"; break }
            }
            if ($chunks -lt 1) { throw "the agent streamed no image tiles" }
            Write-Host "websocket stream: $chunks chunks, $bytes bytes"
            $null = $ws.CloseAsync([System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure, "done", $ct).Wait(3000)

            Write-Host "smoke test passed"
          } finally {
            Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package the folder
        working-directory: remote-pc-control
        shell: pwsh
        run: |
          Compress-Archive -Path dist\RemotePad -DestinationPath dist\RemotePad-windows.zip -Force
          Write-Host "zip: $((Get-Item dist\RemotePad-windows.zip).Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: RemotePad-windows
          path: remote-pc-control/dist/RemotePad-windows.zip
          if-no-files-found: error

      - name: Publish as a release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: remote-pad-latest
          FILE: remote-pc-control/dist/RemotePad-windows.zip
          NOTES: "Windows 用の Remote Pad エージェントです。RemotePad-windows.zip を展開し、中の RemotePad フォルダごと好きな場所に置いて RemotePad.exe を実行してください。URL と 6 桁 PIN が表示されるので、同じ Wi-Fi のスマホからその URL を開きます。Python のインストールは不要です。署名していないため SmartScreen の警告が出ます（詳細情報 → 実行）。ウイルス対策に隔離された場合は誤検知です。Windows セキュリティ → ウイルスと脅威の防止 → 保護の履歴 から復元し、置いたフォルダを除外に追加してください。"
        run: |
          set -euo pipefail

          # Keep the tag on this commit. Deleting and recreating the release
          # instead leaves it as an untagged draft, so the release object is
          # reused and only its asset is replaced.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                 -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                      -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
               --jq "map(select(.tag_name==\"$TAG\")) | .[0].id // empty")

          if [ -n "$id" ]; then
            echo "reusing release $id"
            gh release upload "$TAG" "$FILE" --clobber
            # the old single file build is no longer what we ship
            gh release delete-asset "$TAG" RemotePad.exe --yes 2>/dev/null || true
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
                   -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
                   -f name="Remote Pad (Windows)" -f body="$NOTES" \
                   -F draft=false -F prerelease=true >/dev/null
          else
            echo "creating a new release"
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" \
              --title "Remote Pad (Windows)" --prerelease --notes "$NOTES"
          fi

      - name: Verify the release is downloadable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: remote-pad-latest
        run: |
          set -euo pipefail
          # A draft release is invisible to anyone following the download link,
          # so fail the build rather than report a success nobody can use.
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          draft=$(echo "$rel" | jq -r '.draft')
          url=$(echo "$rel" | jq -r '.assets[] | select(.name=="RemotePad-windows.zip") | .browser_download_url')
          size=$(echo "$rel" | jq -r '.assets[] | select(.name=="RemotePad-windows.zip") | .size')
          digest=$(echo "$rel" | jq -r '.assets[] | select(.name=="RemotePad-windows.zip") | .digest')
          [ "$draft" = "false" ] || { echo "the release is still a draft"; exit 1; }
          [ -n "$url" ] || { echo "RemotePad-windows.zip is not attached"; exit 1; }
          case "$url" in *untagged-*) echo "the release has no tag: $url"; exit 1 ;; esac
          echo "download : $url"
          echo "size     : $size bytes"
          echo "sha256   : $digest"
