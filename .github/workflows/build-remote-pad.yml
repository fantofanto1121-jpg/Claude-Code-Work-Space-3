name: Build Remote Pad (Windows exe)

on:
  push:
    branches: ["**"]
    paths:
      - "remote-pc-control/**"
      - ".github/workflows/build-remote-pad.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build RemotePad.exe
        working-directory: remote-pc-control
        run: >
          pyinstaller --onefile --console --clean
          --name RemotePad
          --add-data "web;web"
          --paths agent
          agent/pc_agent.py

      - name: Smoke test the binary
        working-directory: remote-pc-control
        shell: pwsh
        run: |
          $agent = Start-Process -FilePath dist\RemotePad.exe `
               -ArgumentList '--host','127.0.0.1','--port','8791','--pin','424242' `
               -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 6
          try {
            $info = Invoke-RestMethod 'http://127.0.0.1:8791/api/info'
            Write-Host "info: $($info | ConvertTo-Json -Compress)"
            if ($info.backend -ne 'win32') { throw "expected the win32 backend, got $($info.backend)" }
            if ($info.bpp -lt 24) {
              throw "the capture bitmap is $($info.bpp) bit; a colour capture needs 24 or more"
            }
            Write-Host "capture depth: $($info.bpp) bit"

            $page = Invoke-WebRequest 'http://127.0.0.1:8791/' -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw "the UI was not served" }
            Write-Host "index.html: $($page.RawContentLength) bytes"

            $bad = $null
            try { Invoke-WebRequest 'http://127.0.0.1:8791/api/shot?pin=000000' -UseBasicParsing }
            catch { $bad = $_.Exception.Response.StatusCode.value__ }
            if ($bad -ne 403) { throw "a wrong PIN should be refused, got $bad" }

            Invoke-WebRequest 'http://127.0.0.1:8791/api/shot?pin=424242&w=640' `
              -UseBasicParsing -OutFile shot.png
            $sig = [System.IO.File]::ReadAllBytes("$PWD\shot.png")[0..3]
            if (($sig -join ',') -ne '137,80,78,71') { throw "the capture is not a PNG" }
            Write-Host "capture: $((Get-Item shot.png).Length) bytes of PNG"

            Add-Type -AssemblyName System.Drawing
            $bm = [System.Drawing.Bitmap]::FromFile("$PWD\shot.png")
            try {
              $seen = @{}
              for ($y = 0; $y -lt $bm.Height; $y += 7) {
                for ($x = 0; $x -lt $bm.Width; $x += 7) {
                  $px = $bm.GetPixel($x, $y)
                  $seen["$($px.R),$($px.G),$($px.B)"] = $true
                }
              }
              Write-Host "distinct colours sampled: $($seen.Count)"
              if ($seen.Count -le 2) {
                throw "the capture holds $($seen.Count) colour(s); it is monochrome"
              }
            } finally { $bm.Dispose() }
            Write-Host "smoke test passed"
          } finally {
            Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RemotePad-windows
          path: remote-pc-control/dist/RemotePad.exe
          if-no-files-found: error

      - name: Publish as a release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: remote-pad-latest
          FILE: remote-pc-control/dist/RemotePad.exe
          NOTES: "Windows 用の Remote Pad エージェントです。RemotePad.exe をダウンロードして実行すると、URL と 6 桁 PIN が表示されます。同じ Wi-Fi のスマホからその URL を開いてください。Python のインストールは不要です。初回起動時は Windows Defender SmartScreen の警告が出ます（署名していないため）。「詳細情報」から「実行」を選んでください。"
        run: |
          set -euo pipefail

          # Keep the tag on this commit. Deleting and recreating the release
          # instead leaves it as an untagged draft, so the release object is
          # reused and only its asset is replaced.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                 -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                      -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
               --jq "map(select(.tag_name==\"$TAG\")) | .[0].id // empty")

          if [ -n "$id" ]; then
            echo "reusing release $id"
            gh release upload "$TAG" "$FILE" --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
                   -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
                   -f name="Remote Pad (Windows)" -f body="$NOTES" \
                   -F draft=false -F prerelease=true >/dev/null
          else
            echo "creating a new release"
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" \
              --title "Remote Pad (Windows)" --prerelease --notes "$NOTES"
          fi

      - name: Verify the release is downloadable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: remote-pad-latest
        run: |
          set -euo pipefail
          # A draft release is invisible to anyone following the download link,
          # so fail the build rather than report a success nobody can use.
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          draft=$(echo "$rel" | jq -r '.draft')
          url=$(echo "$rel" | jq -r '.assets[] | select(.name=="RemotePad.exe") | .browser_download_url')
          size=$(echo "$rel" | jq -r '.assets[] | select(.name=="RemotePad.exe") | .size')
          digest=$(echo "$rel" | jq -r '.assets[] | select(.name=="RemotePad.exe") | .digest')
          [ "$draft" = "false" ] || { echo "the release is still a draft"; exit 1; }
          [ -n "$url" ] || { echo "RemotePad.exe is not attached"; exit 1; }
          case "$url" in *untagged-*) echo "the release has no tag: $url"; exit 1 ;; esac
          echo "download : $url"
          echo "size     : $size bytes"
          echo "sha256   : $digest"
