{% extends "base.html" %}
{% block title %}{{ title }} | {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-wrap stack">
  <div class="card">
    <div class="card__body stack">
      <p class="doc-meta">エラーコード {{ status_code }}</p>
      <h1 class="page-title">{{ title }}</h1>
      {% if message %}<p class="page-lede">{{ message }}</p>{% endif %}
      <div class="form-actions">
        <a class="btn btn--primary" href="/">トップページへ戻る</a>
        {% if status_code == 403 and not current_user %}
          <a class="btn btn--outline" href="/login">ログイン</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
