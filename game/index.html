<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>スライム・スリング — はじまりの森</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage" class="stage">
  <canvas id="game" class="game-canvas"></canvas>

  <!-- ===== HUD ===== -->
  <div class="hud">

    <!-- 左上: ステータス -->
    <div class="panel status" id="statusPanel">
      <div class="portrait">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <radialGradient id="pg" cx="38%" cy="32%" r="72%">
              <stop offset="0%" stop-color="#eaf9ff"/>
              <stop offset="45%" stop-color="#8fd7f6"/>
              <stop offset="100%" stop-color="#2f9ad9"/>
            </radialGradient>
          </defs>
          <path d="M32 10c12 0 21 13 21 24 0 9-9 14-21 14S11 43 11 34C11 23 20 10 32 10z" fill="url(#pg)" stroke="#1d6fa5" stroke-width="1.6"/>
          <ellipse cx="23" cy="24" rx="5" ry="3.4" fill="#fff" opacity=".75"/>
          <ellipse cx="26" cy="33" rx="2.5" ry="3.3" fill="#153a56"/>
          <ellipse cx="39" cy="33" rx="2.5" ry="3.3" fill="#153a56"/>
          <ellipse cx="26.8" cy="31.8" rx=".9" ry="1.1" fill="#fff"/>
          <ellipse cx="39.8" cy="31.8" rx=".9" ry="1.1" fill="#fff"/>
          <ellipse cx="20.5" cy="37" rx="3.2" ry="2" fill="#f2a0b4" opacity=".55"/>
          <ellipse cx="44.5" cy="37" rx="3.2" ry="2" fill="#f2a0b4" opacity=".55"/>
          <path d="M29.5 38.5q2.5 2.6 5 0" fill="none" stroke="#153a56" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="lv" id="lvText">Lv.1</span>
      </div>
      <div class="vitals">
        <div class="hearts" id="hearts"></div>
        <div class="xpbar"><i id="xpFill"></i><span id="xpText">0 / 60</span></div>
      </div>
    </div>

    <!-- 右上: ステージ情報 -->
    <div class="quest-wrap">
      <div class="panel quest">
        <div class="quest-head">
          <span class="stage-no" id="stageNo">ステージ 1-1</span>
          <span class="stage-name" id="stageName">はじまりの森</span>
        </div>
        <div class="quest-line">
          <svg class="gem" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 21 12l-9 9.5L3 12z" fill="#f4c84a" stroke="#a97a16" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 2.5 21 12H3z" fill="#fbe49a" opacity=".85"/></svg>
          <span id="questText">モンスターを すべて倒そう！</span>
          <b class="count"><em id="killCount">0</em><span id="killTotal">/5</span></b>
        </div>
      </div>
      <div class="minimap">
        <canvas id="minimap" width="220" height="220"></canvas>
        <span class="north">N</span>
      </div>
    </div>

    <!-- 左下: チュートリアル -->
    <div class="panel tutorial" id="tutorial">
      <div class="tut-head">
        <svg class="tut-slime" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5c6 0 10.5 6.5 10.5 12 0 4.5-4.5 7-10.5 7S5.5 21.5 5.5 17C5.5 11.5 10 5 16 5z" fill="#8fd7f6" stroke="#1d6fa5" stroke-width="1.2"/><ellipse cx="13" cy="16" rx="1.3" ry="1.7" fill="#153a56"/><ellipse cx="19" cy="16" rx="1.3" ry="1.7" fill="#153a56"/></svg>
        <span>スライムを引っ張って、はじく</span>
      </div>
      <ol>
        <li><i>1</i>スライムをタップして引っ張る</li>
        <li><i>2</i>方向を決める</li>
        <li><i>3</i>はなして、はじく！</li>
      </ol>
    </div>

    <!-- 右下: アクション -->
    <div class="actions">
      <button class="act special" id="btnSpecial" type="button" aria-label="スペシャル">
        <span class="ring"><i id="spFill"></i></span>
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 7c7 2 11 7 11 12 0 6-5 10-11 10S9 25 9 19c0-3 2-6 5-7-1 3 0 5 2 6-1-4 1-8 4-11z" fill="none" stroke="#cfe9ff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <em>スペシャル</em>
      </button>

      <button class="act main" id="btnMain" type="button" aria-label="スライム">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 12c11 0 19.5 12 19.5 22 0 8-8.5 12.5-19.5 12.5S12.5 42 12.5 34C12.5 24 21 12 32 12z" fill="#9adcf8" stroke="#1d6fa5" stroke-width="1.8"/>
          <ellipse cx="24" cy="25" rx="4.6" ry="3" fill="#fff" opacity=".8"/>
          <ellipse cx="26" cy="33" rx="2.4" ry="3.1" fill="#153a56"/>
          <ellipse cx="38" cy="33" rx="2.4" ry="3.1" fill="#153a56"/>
          <ellipse cx="21" cy="38" rx="3" ry="1.9" fill="#f2a0b4" opacity=".55"/>
          <ellipse cx="43" cy="38" rx="3" ry="1.9" fill="#f2a0b4" opacity=".55"/>
          <path d="M29.5 39q2.5 2.6 5 0" fill="none" stroke="#153a56" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="act potion" id="btnPotion" type="button" aria-label="ポーション">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M17 7h6v6l5.5 9.5c2 3.6-.4 8.5-4.6 8.5h-7.8c-4.2 0-6.6-4.9-4.6-8.5L17 13z" fill="#d7504c" stroke="#7d2420" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M14.2 22h11.6c1.6 2.8-.2 6-3 6h-5.6c-2.8 0-4.6-3.2-3-6z" fill="#f08b7f" opacity=".7"/>
          <rect x="15.5" y="4.5" width="9" height="4" rx="1.6" fill="#c7a26a" stroke="#6f5324" stroke-width="1.4"/>
        </svg>
        <em class="x" id="potionCount">×3</em>
      </button>
    </div>

    <div class="sys">
      <button id="btnSound" class="chip" type="button">音 ON</button>
      <button id="btnRestart" class="chip" type="button">やり直す</button>
    </div>

    <div class="hint" id="hint"></div>
  </div>

  <!-- ===== オーバーレイ ===== -->
  <div class="overlay" id="overlay" hidden>
    <div class="dialog">
      <h1 id="ovTitle">ステージクリア</h1>
      <p id="ovBody">すべてのモンスターを倒した！</p>
      <div class="ov-stats" id="ovStats"></div>
      <div class="ov-buttons">
        <button class="btn primary" id="ovPrimary" type="button">つぎへ</button>
        <button class="btn" id="ovSecondary" type="button">もう一度</button>
      </div>
    </div>
  </div>
</div>

<script src="js/art.js"></script>
<script src="js/stages.js"></script>
<script src="js/game.js"></script>
</body>
</html>
