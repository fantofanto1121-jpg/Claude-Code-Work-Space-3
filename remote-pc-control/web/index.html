<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Remote Pad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="brand">
      <span class="mark"></span>
      <div>
        <h1>Remote Pad</h1>
        <p id="gate-host">接続先を確認中…</p>
      </div>
    </div>
    <label class="field">
      <span>PIN コード</span>
      <input id="pin" type="text" inputmode="numeric" autocomplete="off"
             maxlength="6" placeholder="000000">
    </label>
    <button class="btn primary" id="connect">接続する</button>
    <p class="msg" id="gate-msg">PC のウィンドウに表示された 6 桁を入力</p>
  </div>
</div>

<header class="bar">
  <span class="dot" id="dot"></span>
  <span class="host" id="host">—</span>
  <span class="lat" id="lat"></span>
  <button class="chip" id="settings-open">設定</button>
  <button class="chip" id="disconnect" title="切断">切断</button>
</header>

<nav class="seg" role="tablist">
  <button role="tab" id="tab-pad" aria-selected="true">トラックパッド</button>
  <button role="tab" id="tab-screen" aria-selected="false">画面</button>
</nav>

<main>
  <section id="view-pad">
    <div class="pad" id="pad">
      <div class="spot" id="spot"></div>
      <div class="pad-hint">
        1 本指でカーソル移動 / タップでクリック<br>
        2 本指でスクロール・タップで右クリック<br>
        長押しでドラッグ固定
      </div>
    </div>
  </section>

  <section id="view-screen" hidden>
    <div class="shot-wrap" id="shot-wrap">
      <span class="placeholder" id="shot-ph">画面を取得します</span>
      <canvas id="shot" hidden></canvas>
      <span class="ping-mark" id="ping-mark"></span>
    </div>
    <div class="shot-bar">
      <button class="btn" id="shot-refresh">再取得</button>
      <div class="chiprow">
        <button class="chip" id="auto-off" aria-pressed="true">停止</button>
        <button class="chip" id="auto-live" aria-pressed="false">ライブ</button>
      </div>
    </div>
    <div class="stats" id="stats">停止中</div>
  </section>
</main>

<footer class="dock">
  <div class="row clicks">
    <button class="mbtn" data-btn="left">左クリック<small>タップでも可</small></button>
    <button class="mbtn" data-btn="middle">中<small>ホイール</small></button>
    <button class="mbtn" data-btn="right">右クリック<small>メニュー</small></button>
  </div>
  <div class="scroll-strip" id="strip">上下にドラッグしてスクロール</div>
  <div class="row">
    <button class="mbtn" id="kb-open">キーボード</button>
    <button class="mbtn" id="drag-lock" aria-pressed="false">ドラッグ固定<small>左ボタンを保持</small></button>
  </div>
</footer>

<div class="sheet" id="kb" hidden>
  <div class="sheet-head">
    <h2>キーボード</h2>
    <div class="chiprow mode">
      <button class="chip" id="kb-mode-keys" aria-pressed="true">ボタン</button>
      <button class="chip" id="kb-mode-text" aria-pressed="false">入力欄</button>
    </div>
    <button class="chip" id="kb-close">閉じる</button>
  </div>

  <div class="kbd" id="kb-keys"></div>

  <div class="kb-text" id="kb-text" hidden>
    <input id="typebox" type="text" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="ここに入力すると PC に送られます">
    <div class="keys" id="keys"></div>
    <p class="kb-hint">日本語を打つときはこちら。端末のキーボードが開きます。</p>
  </div>
</div>

<div class="sheet" id="settings" hidden>
  <div class="sheet-head">
    <h2>設定</h2>
    <button class="chip" id="settings-close">閉じる</button>
  </div>

  <div class="setting-group">
    <h3>トラックパッド</h3>
    <div class="setting">
      <span>高さ</span><output id="out-padSize"></output>
      <input type="range" id="set-padSize" min="40" max="100" step="5">
    </div>
    <div class="setting">
      <span>カーソル感度</span><output id="out-gain"></output>
      <input type="range" id="set-gain" min="0.4" max="2.5" step="0.1">
    </div>
    <div class="setting">
      <span>スクロール感度</span><output id="out-scroll"></output>
      <input type="range" id="set-scroll" min="0.4" max="2.5" step="0.1">
    </div>
    <div class="setting row-only">
      <span>スクロール方向を反転</span>
      <button class="toggle" id="set-invert" aria-pressed="false">オフ</button>
    </div>
    <div class="setting row-only">
      <span>タップでクリック</span>
      <button class="toggle" id="set-tapClick" aria-pressed="true">オン</button>
    </div>
  </div>

  <div class="setting-group">
    <h3>画面</h3>
    <div class="setting row-only">
      <span>解像度</span>
      <div class="seg-mini" id="set-shotWidth">
        <button class="chip" data-w="720">720</button>
        <button class="chip" data-w="1024">1024</button>
        <button class="chip" data-w="1280">1280</button>
        <button class="chip" data-w="1600">1600</button>
      </div>
    </div>
  </div>

  <div class="setting-group">
    <h3>その他</h3>
    <div class="setting row-only">
      <span>ボタン列を隠す</span>
      <button class="toggle" id="set-compact" aria-pressed="false">オフ</button>
    </div>
    <div class="setting row-only">
      <span>振動</span>
      <button class="toggle" id="set-haptics" aria-pressed="true">オン</button>
    </div>
  </div>

  <button class="btn" id="settings-reset">初期設定に戻す</button>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
